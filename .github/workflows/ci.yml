name: reliability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: ${{ matrix.os }} · JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache tool jars
        uses: actions/cache@v4
        with:
          path: |
            tools/*.jar
            tools/*.zip
            tools/jacoco-*
            tools/spotbugs-*
            tools/pmd-bin-*
          key: tools-${{ runner.os }}-${{ hashFiles('tools/fetch.py') }}
      - name: Golden data is reproducible
        shell: bash
        run: |
          python tools/gen_golden_rk4.py
          git diff --exit-code -- src/test/resources/golden/
      - name: Reliability pipeline (compile · test · coverage · mutation · PMD · SpotBugs · trace)
        run: python build.py
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.os }} · JDK ${{ matrix.java }}"
            for f in test-summary coverage-summary mutation-summary; do
              [ -f "build/reports/$f.txt" ] && { echo '```'; head -3 "build/reports/$f.txt"; echo '```'; }
            done
            [ -f docs/traceability.md ] && tail -2 docs/traceability.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            build/reports
            docs/traceability.md

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: pipeline
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, test, coverage report
        if: env.SONAR_TOKEN != ''
        run: python build.py compile test coverage
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'haejyn' }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'Haejyn_orbit-pass-sim' }}
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=build/classes
            -Dsonar.java.test.binaries=build/test-classes
            -Dsonar.java.libraries=tools/junit-platform-console-standalone-1.13.4.jar
            -Dsonar.junit.reportPaths=build/reports/junit
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco.xml
            -Dsonar.coverage.exclusions=**/Main.java
            -Dsonar.qualitygate.wait=true
      - name: Token missing
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN secret is not set — SonarQube Cloud scan skipped"
