name: reliability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test · coverage gate · PMD · SpotBugs (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache tool jars
        uses: actions/cache@v4
        with:
          path: |
            tools/*.jar
            tools/*.zip
            tools/jacoco-*
            tools/spotbugs-*
            tools/pmd-bin-*
          key: tools-${{ hashFiles('tools/fetch.py') }}
      - name: Run reliability pipeline
        run: python build.py --min-line 90 --min-branch 80
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: build/reports
